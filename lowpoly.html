<title>Real World Drive</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc9f0; font-family: system-ui, -apple-system, sans-serif; }

  #presets { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  #presets button { background: #334; font-weight: 500; font-size: 12px; padding: 5px 8px; }
  #presets button:hover { background: #445; }
  #status { margin-top: 8px; font-size: 13px; opacity: 0.85; }
  #loading { margin-top: 4px; font-size: 12px; color: #ffd76a; min-height: 15px; }
  #speed { bottom: 16px; right: 16px; font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  #speed small { font-size: 14px; font-weight: 500; opacity: 0.7; }
  #help { bottom: 16px; left: 12px; font-size: 12px; line-height: 1.6; }
  #attr { position: fixed; bottom: 2px; right: 6px; font-size: 10px; color: #223; opacity: 0.7; }
  #minimap { position: fixed; top: 12px; right: 12px; width: 200px; height: 200px; border-radius: 50%; border: 3px solid rgba(15, 20, 30, 0.72); box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3); cursor: pointer; background: #86a071; }

  kbd { background: #fff2; border-radius: 3px; padding: 0 4px; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

  while (jobs.length && performance.now() < end) {
    const job = jobs[0];
    let r;
    do { r = job.gen.next(); } while (!r.done && performance.now() < end);
    if (r.done) jobs.shift();
  }
}

// ---------- Tile streaming ----------
const LOAD_RADIUS = 1300, UNLOAD_RADIUS = 3200, MAX_FETCH = 4;
let tiles = new Map(), fetching = 0, tileUrl = null;

async function getTileUrl() {
  while (!tileUrl) {
    try {
      const r = await fetch('https://tiles.openfreemap.org/planet');
      tileUrl = (await r.json()).tiles[0];
    } catch (e) { await new Promise(r => setTimeout(r, 2000)); }
  }
}
getTileUrl();

function makeTile(tx, ty) {
  const [x0, z0] = toXZ(ty2lat(ty), tx2lon(tx)), [x1, z1] = toXZ(ty2lat(ty + 1), tx2lon(tx + 1));
  const group = new THREE.Group();
  world.add(group);
  return { key: tx + '/' + ty, tx, ty, x0, z0, x1, z1, cx: (x0 + x1) / 2, cz: (z0 + z1) / 2,
    group, bgrid: new Map(), rgrid: new Map(), agrid: new Map(), state: 'new', roadsDone: false, retryAt: 0 };
}
function disposeTile(t) {
  t.group.traverse(o => {
    if (o.isInstancedMesh) return o.dispose(); // tree models are shared; only free the instance data
    if (o.geometry) o.geometry.dispose();
    if (o.userData.ownsMaterial) { o.material.map.dispose(); o.material.dispose(); }
  });
  world.remove(t.group);
  tiles.delete(t.key);
  jobs = jobs.filter(j => j.tile !== t);
}

async function fetchTile(t) {
  fetching++;
  t.state = 'loading';
  const ctrl = new AbortController(), timer = setTimeout(() => ctrl.abort(), 20000);
  try {
    const url = u => u.replace('{z}', Z).replace('{x}', t.tx).replace('{y}', t.ty);
    const [r, er] = await Promise.all([fetch(url(tileUrl), { signal: ctrl.signal }), fetch(url(ELEV_URL), { signal: ctrl.signal })]);
    if (!er.ok || !(r.ok || r.status === 404 || r.status === 204)) throw new Error(r.status + '/' + er.status);
    const data = r.ok && r.status !== 204 ? new Uint8Array(await r.arrayBuffer()) : null;
    const heights = await decodeTerrarium(await er.blob());
    if (tiles.get(t.key) !== t) return;
    t.heights = heights;
    t.state = 'building';
    jobs.push({ tile: t, gen: buildTile(t, data && data.length ? new VectorTile(new Pbf(data)) : null) });
  } catch (e) {
    t.state = 'error';
    t.retryAt = performance.now() + 3000;
  } finally { clearTimeout(timer); fetching--; }
}

function rectDist(t, x, z) {
  return Math.hypot(Math.max(t.x0 - x, 0, x - t.x1), Math.max(t.z0 - z, 0, z - t.z1));
}

function updateTiles() {
  if (!tileUrl) return;
  // Look ahead in the direction of travel so the road in front is ready in time
  const fx = Math.sin(car.h), fz = Math.cos(car.h);
  const ahead = Math.min(Math.abs(car.v) * 8, 1200) * Math.sign(car.v);
  const want = [];
  for (const [px, pz] of [[car.x, car.z], [car.x + fx * ahead, car.z + fz * ahead]]) {
    const nw = toLatLon(px - LOAD_RADIUS, pz - LOAD_RADIUS), se = toLatLon(px + LOAD_RADIUS, pz + LOAD_RADIUS);
    for (let tx = Math.floor(lon2tx(nw.lon)); tx <= Math.floor(lon2tx(se.lon)); tx++)
      for (let ty = Math.floor(lat2ty(nw.lat)); ty <= Math.floor(lat2ty(se.lat)); ty++) {
        const key = tx + '/' + ty;
        let t = tiles.get(key);
        if (!t) tiles.set(key, t = makeTile(tx, ty));
        if (rectDist(t, px, pz) <= LOAD_RADIUS) want.push(t);
      }
  }
  const now = performance.now();
  want.sort((a, b) => rectDist(a, car.x, car.z) - rectDist(b, car.x, car.z));
  for (const t of want) {
    if (fetching >= MAX_FETCH) break;
    if (t.state === 'new' || (t.state === 'error' && now > t.retryAt)) fetchTile(t);
  }
  for (const t of [...tiles.values()])
    if (rectDist(t, car.x, car.z) > UNLOAD_RADIUS) disposeTile(t);

  if (!started) {
    const t = tiles.get(tileKeyAt(0, 0));
    if (t && t.roadsDone) { resetCar(0, 0); statusEl.textContent = `📍 ${placeName}`; }
  }
  const pending = [...tiles.values()].filter(t => t.state !== 'ready' && rectDist(t, car.x, car.z) < 900).length;
  loadingEl.textContent = pending ? `⏳ Loading map around you… (${pending})` : '';
}
setInterval(updateTiles, 250);

const statusEl = document.getElementById('status'), loadingEl = document.getElementById('loading');
let placeName = '';

function goTo(lat, lon, name) {
  for (const t of [...tiles.values()]) disposeTile(t);
  origin = { lat, lon }; placeName = name; started = false;
  region = regionOf(lat, lon);
  Object.assign(car, { x: 0, y: 0, z: 0, h: 0, v: 0, steer: 0, pitch: 0, roll: 0 });
  statusEl.textContent = `Loading ${name}…`;
  updateTiles();
}

// ---------- Car ----------
function makeCar() {
  const g = new THREE.Group();
  const paint = new THREE.MeshLambertMaterial({ color: 0xe8433a });
  const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.7, 4.3), paint);
  body.position.y = 0.7; g.add(body);
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.6, 2.1), new THREE.MeshLambertMaterial({ color: 0x222a35 }));
  cabin.position.set(0, 1.35, -0.25); g.add(cabin);
  const roof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.08, 1.9), paint);
  roof.position.set(0, 1.68, -0.3); g.add(roof);
  const light = (c, x, z) => { const m = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.2, 0.05), new THREE.MeshBasicMaterial({ color: c })); m.position.set(x, 0.8, z); g.add(m); };
  light(0xfff6c0, 0.65, 2.16); light(0xfff6c0, -0.65, 2.16); light(0xff2020, 0.7, -2.16); light(0xff2020, -0.7, -2.16);
  const wheels = [];
  const wGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 18); wGeo.rotateZ(Math.PI / 2);
  const wMat = new THREE.MeshLambertMaterial({ color: 0x151515 });
  for (const [x, z] of [[1, 1.4], [-1, 1.4], [1, -1.4], [-1, -1.4]]) {
    const pivot = new THREE.Group(); pivot.position.set(x, 0.4, z);
    const w = new THREE.Mesh(wGeo, wMat); pivot.add(w); g.add(pivot);
    // roll forwards `distance` m, front wheels steered `steer` rad
    wheels.push({ update(distance, steer) { w.rotation.x += distance / 0.4; if (z > 0) pivot.rotation.y = steer; } });
  }
  g.userData = { lean: body, wheels, eye: [0, 0.3, 1.6] };
  return g;
}
// carMesh carries the physics transform; carModel is whichever car body is inside it
const carMesh = new THREE.Group();
let carModel = makeCar();
carMesh.add(carModel);
scene.add(carMesh);

// The starter car, put together from its parts as your garage has it (garage/visual.js: the same
// build and paint as in the other worlds). Each wheel's rim and tyre hang from a pivot that spins
// about the car's axle, whichever way its socket faces: physics/sockets.js modelRig
(async () => {
  const session = await garageSession(), carDef = session.garage.car, M = carDef.model;
  const rig = modelRig(await (await fetch(M.file)).arrayBuffer(), M);
  const vis = await createCarVisual({ car: carDef, finishes: session.db.finishes, models: new ModelCache(), paint: session.paint });
  await vis.applyBuild(session.garage.build, session.garage.view);
  session.onLook(() => { vis.applyBuild(session.garage.build, session.garage.view); vis.setPaint(session.paint); });
  const lean = new THREE.Group();
  lean.add(vis.group);
  const wheels = Object.entries(rig.wheels).map(([k, r]) => {
    const pivot = vis.wheels[k];
    let spin = 0;
    return { update(distance, steer) {
      spin += distance / (vis.wheelRadius(k) ?? 0.29);
      const t = wheelTransform(r, [0, 0, 0, 1], k[0] === 'F' ? steer : 0, spin, 0);
      pivot.quaternion.fromArray(t.rotation); pivot.position.fromArray(t.position);
    } };
  });
  const glass = [];
  vis.root.traverse(o => { if (o.isMesh && /glass/i.test(o.material?.name || '')) glass.push(o); });
  lean.userData = { lean, wheels, glass, eye: [0.38, -0.3, 1.1] }; // driver sits on the left
  carMesh.remove(carModel);
  carMesh.add(carModel = lean);
})().catch(e => console.warn('Could not load the car model, using the box car', e));
const car = { x: 0, y: 0, z: 0, h: 0, v: 0, steer: 0, pitch: 0, roll: 0 };
carMesh.rotation.order = 'YXZ';
let started = false;

function nearestRoad(px, pz, minRank, maxR = 600) {
  let best = null, bestD = Infinity;
  const stamp = ++stampCounter, x0 = px - maxR, z0 = pz - maxR, x1 = px + maxR, z1 = pz + maxR;
  for (const t of tilesInBox(x0, z0, x1, z1))
    forCells(t.rgrid, x0, z0, x1, z1, stamp, s => {
      if (s.rank < minRank) return;
      const dx = s.bx - s.ax, dz = s.bz - s.az, l2 = dx * dx + dz * dz || 1;
      const k = Math.max(0, Math.min(1, ((px - s.ax) * dx + (pz - s.az) * dz) / l2));
      const x = s.ax + k * dx, z = s.az + k * dz;
      const d = Math.hypot(x - px, z - pz) - s.rank * 15;
      if (d < bestD) { bestD = d; best = { x, z, h: Math.atan2(dx, dz) }; }
    });
  return best;
}
function resetCar(px, pz) {
  const best = nearestRoad(px, pz, 2) || nearestRoad(px, pz, 0);
  Object.assign(car, best || { x: px, z: pz, h: car.h }, { v: 0, steer: 0 });
  car.y = (hAt(car.x, car.z) ?? car.y) + 0.45;
  if (!started) camera.position.set(car.x - Math.sin(car.h) * 12, car.y + 6, car.z - Math.cos(car.h) * 12);
  started = true;
}

// ---------- Input ----------
const keys = {};
let camMode = 0;
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (e.code === 'KeyR' && started) resetCar(car.x, car.z);
  if (e.code === 'KeyC') camMode = (camMode + 1) % 3;
  if (e.code === 'KeyM') zoom = (zoom + 1) % ZOOMS.length;
  if (e.code.startsWith('Arrow') || e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- Physics ----------
function updateCar(dt) {
  const gas = keys.KeyW || keys.ArrowUp, brake = keys.KeyS || keys.ArrowDown;
  const left = keys.KeyA || keys.ArrowLeft, right = keys.KeyD || keys.ArrowRight;
  if (gas) car.v += (car.v < 0 ? 30 : 12 * (1 - car.v / 60)) * dt;
  else if (brake) car.v -= (car.v > 0 ? 30 : 8) * dt;
  else car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), 3 * dt);
  if (keys.Space) car.v -= Math.sign(car.v) * Math.min(Math.abs(car.v), 22 * dt);
  car.v -= 9.8 * Math.sin(car.pitch) * 0.7 * dt; // hills slow you down going up, speed you up going down
  car.v = Math.max(-12, Math.min(car.v, 55));

  const target = (left ? 1 : 0) - (right ? 1 : 0);
  car.steer += (target - car.steer) * Math.min(1, 6 * dt);
  const grip = Math.min(1, Math.abs(car.v) / 6) / (1 + Math.abs(car.v) * 0.035);
  car.h += car.steer * 2.0 * grip * Math.sign(car.v) * dt * (keys.Space ? 1.6 : 1);

  const fx = Math.sin(car.h), fz = Math.cos(car.h);
  const nx = car.x + fx * car.v * dt, nz = car.z + fz * car.v * dt;
  const s = Math.sign(car.v) || 1;
  const hit = inBuilding(nx + fx * 2.1 * s, nz + fz * 2.1 * s) ||
    inBuilding(nx + fx * 2 * s + fz * 0.9, nz + fz * 2 * s - fx * 0.9) ||
    inBuilding(nx + fx * 2 * s - fz * 0.9, nz + fz * 2 * s + fx * 0.9);
  if (hit && !inBuilding(car.x, car.z)) car.v = -car.v * 0.3;
  else { car.x = nx; car.z = nz; }

  // Sit on the terrain, tilted to match the slope under the wheels
  const hc = hAt(car.x, car.z);
  if (hc !== null) {
    const hf = hAt(car.x + fx * 1.5, car.z + fz * 1.5) ?? hc, hb = hAt(car.x - fx * 1.5, car.z - fz * 1.5) ?? hc;
    const hl = hAt(car.x + fz * 0.9, car.z - fx * 0.9) ?? hc, hr = hAt(car.x - fz * 0.9, car.z + fx * 0.9) ?? hc;
    car.y = hc + 0.45;
    car.pitch = Math.atan2(hf - hb, 3);
    car.roll = Math.atan2(hl - hr, 1.8);
  }
  carMesh.position.set(car.x, car.y, car.z);
  carMesh.rotation.set(-car.pitch, car.h, car.roll);
  const { lean, wheels } = carModel.userData;
  lean.rotation.z = -car.steer * Math.min(1, Math.abs(car.v) / 30) * 0.05;
  for (const w of wheels) w.update(car.v * dt, car.steer * 0.45);
}

function updateCamera(dt) {
  const fx = Math.sin(car.h), fz = Math.cos(car.h);
  for (const g of carModel.userData.glass || []) g.visible = camMode !== 2; // tinted glass washes out the in-car view
  if (camMode === 2) {
    const [side, fwd, up] = carModel.userData.eye;
    camera.position.set(car.x + fx * fwd + fz * side, car.y + up, car.z + fz * fwd - fx * side);
    camera.lookAt(camera.position.x + fx * 20, camera.position.y - 0.4 + Math.tan(car.pitch) * 20, camera.position.z + fz * 20);
    return;
  }
  const [back, up] = camMode === 0 ? [10, 4] : [26, 14];
  const target = new THREE.Vector3(car.x - fx * back, car.y + up, car.z - fz * back);
  camera.position.lerp(target, 1 - Math.exp(-4 * dt));
  const th = hAt(camera.position.x, camera.position.z);
  if (th !== null && camera.position.y < th + 2) camera.position.y = th + 2; // never go inside a hill
  camera.lookAt(car.x + fx * 3, car.y + 1.2, car.z + fz * 3);
}

// ---------- Minimap ----------
const mini = document.getElementById('minimap'), mctx = mini.getContext('2d');
const MINI = 200, ZOOMS = [120, 250, 500];
const ROAD_COLORS = ['#ddd5c4', '#f4f1ea', '#ffffff', '#ffffff', '#fbe08a', '#f7c35c', '#ef9a48'];
let zoom = 1;
mini.width = mini.height = MINI * devicePixelRatio;
mini.onclick = () => zoom = (zoom + 1) % ZOOMS.length;

function ringsToPath(path, rings) {
  for (const r of rings) {
    path.moveTo(r[0][0], r[0][1]);
    for (let k = 1; k < r.length; k++) path.lineTo(r[k][0], r[k][1]);
    path.closePath();
  }
}

function drawMinimap() {
  const ctx = mctx, r = MINI / 2, range = ZOOMS[zoom], s = r / range;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  ctx.fillStyle = '#86a071';
  ctx.fillRect(0, 0, MINI, MINI);

  // World layer: centred on the car and rotated so its heading points up
  ctx.save();
  ctx.translate(r, r);
  ctx.rotate(car.h + Math.PI);
  ctx.scale(s, s);
  ctx.translate(-car.x, -car.z);

  const x0 = car.x - range, x1 = car.x + range, z0 = car.z - range, z1 = car.z + range;
  const stamp = ++stampCounter;
  const land = new Map(), water = new Path2D(), bpath = new Path2D(), byRank = ROAD_COLORS.map(() => []);
  for (const t of tilesInBox(x0, z0, x1, z1)) {
    forCells(t.agrid, x0, z0, x1, z1, stamp, a => {
      if (a.water) return ringsToPath(water, a.rings);
      if (!land.has(a.css)) land.set(a.css, new Path2D());
      ringsToPath(land.get(a.css), a.rings);
    });
    forCells(t.bgrid, x0, z0, x1, z1, stamp, b => ringsToPath(bpath, b.rings));
    forCells(t.rgrid, x0, z0, x1, z1, stamp, g => byRank[g.rank].push(g));
  }
  for (const [css, p] of land) { ctx.fillStyle = css; ctx.fill(p, 'evenodd'); }
  ctx.fillStyle = '#5c9bd1'; ctx.fill(water, 'evenodd');
  ctx.fillStyle = '#b8ad98'; ctx.fill(bpath, 'evenodd');

  ctx.lineCap = ctx.lineJoin = 'round';
  const px = 1 / s;
  // Dark casing under car roads, then road fills from minor to major
  for (let pass = 0; pass < 2; pass++)
    byRank.forEach((segs, rank) => {
      if (!segs.length || (pass === 0 && rank < 2)) return;
      ctx.beginPath();
      for (const g of segs) { ctx.moveTo(g.ax, g.az); ctx.lineTo(g.bx, g.bz); }
      const w = Math.max(segs[0].w, (rank < 2 ? 1 : 2.5) * px);
      ctx.lineWidth = pass === 0 ? w + 2 * px : w;
      ctx.strokeStyle = pass === 0 ? '#5d5d5d' : ROAD_COLORS[rank];
      ctx.stroke();
    });
  ctx.restore();

  // Car arrow (always pointing up)
  ctx.beginPath();
  ctx.moveTo(r, r - 10); ctx.lineTo(r + 7, r + 8); ctx.lineTo(r, r + 4); ctx.lineTo(r - 7, r + 8);
  ctx.closePath();
  ctx.fillStyle = '#e8433a'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

  // North marker on the rim
  const nx = r - Math.sin(car.h) * (r - 14), ny = r + Math.cos(car.h) * (r - 14);
  ctx.beginPath(); ctx.arc(nx, ny, 9, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(15, 20, 30, 0.8)'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('N', nx, ny + 0.5);
}

// ---------- Loop ----------
const speedEl = document.getElementById('speed');
const clock = new THREE.Clock();
let frame = 0;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (started) {
    updateCar(dt);
    updateCamera(dt);
    speedEl.innerHTML = `${Math.round(Math.abs(car.v) * 3.6)} <small>km/h</small>`;
  } else {
    const t = performance.now() / 4000, base = hAt(0, 0) ?? 0;
    camera.position.set(Math.sin(t) * 300, base + 220, Math.cos(t) * 300);
    camera.lookAt(0, base, 0);
  }
  runJobs(started ? 8 : 30);
  renderer.render(scene, camera);
  if (frame++ % 2 === 0) drawMinimap();
});

// ---------- UI ----------
const PRESETS = [
  ['New York', 40.7580, -73.9855], ['London', 51.5080, -0.1281], ['Paris', 48.8738, 2.2950],
  ['Tokyo', 35.6595, 139.7005], ['San Francisco', 37.7880, -122.4075], ['Sydney', -33.8688, 151.2093],
  ['Swiss Alps', 46.6244, 8.0413],
];
const presetsEl = document.getElementById('presets');
for (const [n, lat, lon] of PRESETS) {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => goTo(lat, lon, n);
  presetsEl.appendChild(b);
}
document.getElementById('search').onsubmit = async e => {
  e.preventDefault();
  const input = document.getElementById('q'), q = input.value.trim();
  if (!q) return;
  statusEl.textContent = `Searching “${q}”…`;
  input.blur();
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`);
    const [hit] = await r.json();
    if (!hit) return statusEl.textContent = `Couldn't find “${q}”`;
    goTo(parseFloat(hit.lat), parseFloat(hit.lon), hit.display_name.split(',').slice(0, 2).join(','));
  } catch { statusEl.textContent = 'Search failed — try again'; }
};

goTo(40.7580, -73.9855, 'New York');
</script>
