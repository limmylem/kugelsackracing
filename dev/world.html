<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/site/config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- (the test worlds load their data relative to the project's root, like index.html) -->
<base href="../">
<title>Test world</title>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/+esm"
} }
</script>
<style>
  /* A development page: one test world straight away, without the real world (Cesium) or its account —
     dev/world.html?world=rally (proving_ground, test_centre, rally, test_track); hud=0 hides the HUD.
     The full styling of the HUD and panels is index.html's; here they're plain. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9cc9f0; font-family: system-ui, -apple-system, sans-serif; }
  #testHud { position: fixed; top: 12px; left: 12px; z-index: 5; background: rgba(15, 20, 30, 0.78); color: #fff; border-radius: 10px; padding: 12px 14px; font-size: 12px; line-height: 1.5; max-width: 420px; max-height: 45vh; overflow: hidden; }
  body.nohud #testHud { display: none !important; }
  #settings { position: fixed; z-index: 30; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(900px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow: auto; background: rgba(15, 20, 30, 0.95); color: #fff; border-radius: 12px; padding: 14px 18px; font: 13px system-ui, sans-serif; }
  #settings[hidden], #tuning[hidden], #telemetry[hidden] { display: none; }
  kbd { background: #fff2; border-radius: 3px; padding: 0 4px; }
</style>
</head>
<body>
<script type="module">
  import { enter, debug, hooks, testDriveRoute } from './testtrack/test-scene.js';
  const q = new URLSearchParams(location.search);
  if (q.get('hud') === '0') document.body.classList.add('nohud');
  window.testWorld = debug;
  // (a tow: to the development garage, open on the damage report)
  hooks.toGarage = () => { location.href = 'dev/garage.html?tab=damage'; };
  // a generated track (Phase 5): ?world=track&code=<track code>; &drive=1 starts the route test drive on
  // it (countdown, checkpoints, timing, resets — the editor's, Phase 4 Step 2); &laps=N; F2 ends it
  if (q.get('world') === 'track') {
    const code = q.get('code');
    await enter(`track:${code}`);
    if (q.get('drive') === '1') {
      const { viewCourse } = await import('./route/model.js'), { trackProjection } = await import('./track/build.js');
      const course = debug.active.trackData.course, laps = +(q.get('laps') ?? 1);
      const drive = () => testDriveRoute({ compiled: viewCourse(course, trackProjection), item: { course }, laps, autopilot: q.has('autopilot'), onDone: r => { window.__trackDrive = r; if (q.get('again') !== '0') setTimeout(drive, 1500); } });
      window.__trackDrive = null;
      drive();
    }
  } else await enter(`scenes/${q.get('world') ?? 'test_centre'}.json`);
</script>
</body>
</html>
