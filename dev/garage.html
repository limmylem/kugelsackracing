<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- (the garage loads its data relative to the project's root, like index.html) -->
<base href="../">
<title>Garage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet">
<link rel="stylesheet" href="ui/theme.css">
<link rel="stylesheet" href="garage/garage.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
  "@dimforge/rapier3d-compat": "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.21.0/+esm"
} }
</script>
<style>
  /* A development page: the garage straight away, without the real world (Cesium) or its account —
     dev/garage.html?tab=damage opens a tab. Test drive goes to the test centre (dev/world.html), and
     comes back here. The real game's garage is index.html's Garage world. */
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1013; }
</style>
</head>
<body>
<script type="module">
  import * as garage from './garage/garage.js';
  const q = new URLSearchParams(location.search);
  window.garageWorld = garage.debug;
  await garage.enter({ leave: () => {}, testDrive: () => { location.href = 'dev/world.html?world=test_centre&back=garage'; } });
  if (q.get('tab')) garage.debug.screen.setTab(q.get('tab'));
</script>
</body>
</html>
