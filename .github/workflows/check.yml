# The checks of tools/check-deploy.mjs on demand (docs/DEPLOYMENT.md "Checks"): production as players reach it — every
# address over HTTPS, the game, the API and its database, the tiles, real time through the tunnel. No approval needed:
# it only reads.
name: check

on:
  workflow_dispatch:
    inputs:
      hsts: { description: 'Expect HSTS (on by itself when the repository variable HSTS is "on")', type: boolean, default: false }

permissions:
  contents: read

# (bash with pipefail everywhere)
defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Production
        env:
          HSTS: ${{ (inputs.hsts || vars.HSTS == 'on') && 'on' || 'off' }}
        run: |
          hsts=(); [ "$HSTS" != on ] || hsts=(--hsts)
          node tools/check-deploy.mjs --env production --game https://ognistrada.com --api https://api.ognistrada.com \
            --tiles https://tiles.ognistrada.com --rt wss://rt.ognistrada.com --www "${hsts[@]}"
