# The server (docs/SERVER.md): on every push and pull request, its typecheck, every server test against a
# PostgreSQL with PostGIS (and a Redis, for multiplayer), the browser's account flows, multiplayer's tests,
# and a check of the dependencies for known vulnerabilities. Three jobs side by side, so a fix reaches players in
# minutes (the owner's choice): `checks` (the fast ones: the audit, secrets, typecheck, every server test), `image`
# (on main: built and pushed to ghcr.io/limmylem/kugelsackracing:<commit> and :main at once) and `test` (the slow
# ones: browsers, multiplayer, load, the drills). A deploy waits for `checks` and `image` only — once the repository
# variable DEPLOY_ENABLED is "true", and when the owner approves it (deploy.yml; the "production" environment's
# required reviewer); `test` goes on beside it, and a failure there is fixed, or rolled back, after. docs/DEPLOYMENT.md
# "Deploying".
name: server
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # (the fast ones: a deploy waits for these)
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 30
      # (the real-time server's rooms, tickets and bans: docs/MULTIPLAYER.md)
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependencies with known vulnerabilities (high or critical, in what's deployed)
        run: npm audit --omit=dev --audit-level=high
      - name: Leaked secrets in the files (docs/SECURITY.md; the history weekly in security.yml)
        run: node tools/scan-secrets.mjs
      - name: The credits screen lists every data source and package (npm run credits)
        run: node tools/credits.mjs --check
      - name: Typecheck
        run: npm run server:typecheck
      - name: Server tests (accounts, roles, world content, tracks, the economy, the API's defences)
        run: npm run test:server

  # (the slow ones: browsers, multiplayer, load, the drills — beside the deploy, not before it; a newer push's run
  # takes over from an older one still going: it tests all of that and more. Deploys wait their turn in deploy.yml)
  test:
    runs-on: ubuntu-latest
    concurrency:
      group: server-test-${{ github.ref }}
      cancel-in-progress: true
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 30
      # (the real-time server's rooms, tickets and bans: docs/MULTIPLAYER.md)
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://postgres:ci-only-password@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: World content at scale (50,000 markers in PostGIS against the Phase 4 limits)
        run: npm run --workspace @kr/server stress:content
      - name: Accounts in a browser (sign up, confirm, reset, a guest made an account, delete, offline)
        run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node server/tools/accounts-browser.ts
      - name: The economy in a browser (shown at once, put back on a refusal, offline and back, two tabs; the admin page)
        run: CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node server/tools/economy-browser.ts
      - name: The deployment's layout in a browser (game, API, tiles, real time on addresses of their own; cookies, CORS, the admin and editor pages for their roles)
        run: CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node server/tools/deploy-browser.ts
      - name: The launch screens in a browser (support and feedback, credits, status; the admin's support, closed beta and invites, monitoring, history)
        run: CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node server/tools/launch-browser.ts
      - name: The sound in a browser (docs/AUDIO.md) — an 8-car race with crashes through the whole audio graph (never past the limiter's ceiling, within its CPU budget), every Opus against its WAV, another car's voice changing detail without a click, the audio test page
        run: CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node tools/audio-browser.mjs
      - name: Multiplayer (docs/MULTIPLAYER.md; reports/multiplayer-test.md) — 8 bots on a real route, bad networks, time sync, bandwidth with 8 and 30 cars, several processes, 256 players' tick, reconnect ×100
        run: node --expose-gc server/tools/rt-test.ts
      - name: Multiplayer in two browsers (each sees the other's car move smoothly, its wheels, lights, sound and dents; reconnecting; at 150 ms, 30 ms jitter, 5% loss)
        run: CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node server/tools/mp-browser.ts
      - name: Multiplayer in two windows of one browser (one sign-in; ?player=A/B; each window draws the other's car, moving; a background window stays; F8, F9)
        run: CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node server/tools/mp-two-windows.ts
      - name: Multiplayer races with bots (one real-time process, no Redis; reports/mp-races.md) — a ranked quick race on a real-world route, a generated track, a party and the NPC fill, disconnects, chat and kicks, a spectator
        run: node server/tools/mp-race-test.ts
      - name: The real-time server crashing (killed mid-race and mid-free-roam, started again; nothing lost or paid twice, everyone back by themselves)
        run: node server/tools/rt-crash-test.ts
      - name: Car-to-car contact (physics bots at 0, 80, 150 and 250 ms; auto-ghosting, blame, faked contacts, 8 cars)
        run: node server/tools/mp-contact-test.ts
      - name: Matchmaking under load (2,000 bots queuing at once against one process; queue times and match quality within data/multiplayer.json's targets)
        run: node server/tools/mp-load-test.ts --bots 2000 --workers 4
      - name: Multiplayer races in the browser (what each screen draws — lobby, loading, the lights against the server's clock, live positions, a spectator's cameras, confirmed results; a quick race)
        run: CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" node server/tools/mp-browser-race.ts
      - name: Disaster recovery drill (backup, the database lost, restored, every row and sign-in checked; docs/DISASTER_RECOVERY.md)
        run: node server/tools/dr-test.ts
      - name: Rollback drill (a broken release with a migration, its alert, rolled back on the newer schema; docs/OPERATIONS.md)
        run: node server/tools/rollback-test.ts
      - name: The economy under load (500 players in the garage and on the road; the books balanced after)
        run: npm run --workspace @kr/server load-test:economy
      - name: The whole game under load (500 players at once, every step within its limit; reports/load-test.md)
        run: npm run --workspace @kr/server load-test:full -- --players 500
      - name: The server's image builds
        run: docker build -t kr-server:ci --build-arg GIT_COMMIT=${{ github.sha }} .

  # (the image the server runs — the API and the real-time server — named by its commit; the newest 20 kept, so a
  # rollback can go back that far: rollback.yml)
  image:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # (one plain image for the server's processor: no attestations alongside, so each commit is one package
      # version and pruning by count is safe; assets/ in a layer of its own, cached, pushed only when it changes)
      - name: Build and push ghcr.io/limmylem/kugelsackracing:${{ github.sha }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: GIT_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/limmylem/kugelsackracing:${{ github.sha }}
            ghcr.io/limmylem/kugelsackracing:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Old images removed (the newest 20 kept)
        uses: actions/delete-package-versions@v5
        # (housekeeping: a refusal here doesn't stop the deploy)
        continue-on-error: true
        with:
          package-name: kugelsackracing
          package-type: container
          min-versions-to-keep: 20

  # (skipped until the repository variable DEPLOY_ENABLED is "true": docs/GO_LIVE.md; the owner approves each run in
  # GitHub before it starts — the deploy job's environment)
  production:
    needs: [checks, image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
