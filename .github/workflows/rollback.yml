# Rollback (docs/DEPLOYMENT.md "Rolling back"): production put back to a commit deployed before — its map files, its
# server (that commit's image) and its game, in deploy.yml's order, then checked. One step: Actions → rollback → Run
# workflow → the commit; then approve it like any deploy. The database stays as it is: migrations only add, so an
# earlier server runs on the newer schema (server/tools/rollback-test.ts drills exactly that).
name: rollback

on:
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          The commit to go back to — one deployed before, the one before the bad deploy (its hash, full or the first 7
          characters). Where to find it: Actions → server → the runs whose production job succeeded (each names its
          commit), or the server's /opt/ognistrada/deployed.log (one line a deploy: the time, the commit; newest last).
          Only commits with an image can be deployed: the newest 20 built on main.
        type: string
        required: true

permissions:
  contents: read
  packages: read

# (bash with pipefail everywhere)
defaults:
  run:
    shell: bash

jobs:
  # (the commit, and its image: anything else stops here, before production is touched)
  image:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.find.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: find
        env:
          REF: ${{ inputs.ref }}
        run: |
          ref=$(tr -d '[:space:]' <<<"$REF")
          sha=$(git rev-parse --verify --quiet "$ref^{commit}") || { echo "::error title=No such commit::$ref isn't a commit in this repository"; exit 1; }
          if ! docker manifest inspect "ghcr.io/limmylem/kugelsackracing:$sha" > /dev/null 2>&1; then
            echo "::error title=No image for ${sha:0:7}::there's no image ghcr.io/limmylem/kugelsackracing:$sha — only commits built on main have one (the server workflow's image job), and only the newest 20 are kept. Pick a commit that was deployed (Actions → server, or /opt/ognistrada/deployed.log)."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "### Rolling back to ${sha:0:7}: $(git log -1 --format='%s (%cs)' "$sha" | cut -c1-160)" >> "$GITHUB_STEP_SUMMARY"
          echo "rolling back to $sha — its image is there"

  rollback:
    needs: image
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.image.outputs.sha }}
    secrets: inherit
