# The live game opened in a real browser, and what went wrong on its pages printed (tools/live-look.mjs). Read only:
# no secrets, no sign-in. Run by hand: Actions → live-look → Run workflow.
name: live-look

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  look:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - run: node tools/live-look.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: 'live-*.png', retention-days: 3 }
