<!doctype html>
<html lang="en">
<head>

<title>Ogni Strada · Account</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=Saira:ital,wdth,wght@1,125,800;1,125,900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../ui/theme.css">
<style>
  /* the account page (account/account.js): sign in, make an account, play as a guest, a forgotten password,
     the terms; signed in — the name, signing out (here or everywhere), the data, deleting the account.
     The look: the Ogni Strada brand (chrome logo, racing red, topographic lines, a glowing road) */
  :root {
    --c-accent: #FF3B2F; --c-accent-hover: #FF5A45; --c-accent-ink: #fff; --c-accent-tint: rgba(255, 59, 47, .14);
    --os-red: #E3121E; --os-red-hi: #FF4A36; --os-ink: #050506; --os-card: rgba(13, 13, 15, .94); --os-well: #0A0A0C;
    --os-line: #2A2A2F; --os-line-hi: #3A3A40; --os-text-2: #B8BCC3; --os-text-3: #7D838B;
    --f-display: 'Saira', 'Barlow Condensed', system-ui, sans-serif;
    --cut: 26px;
  }
  html, body { margin: 0; min-height: 100%; background: var(--os-ink); color: var(--c-text); font: 500 var(--t-body)/1.45 var(--f-ui); }
  * { box-sizing: border-box; }
  body { overflow-x: hidden; }

  /* the backdrop: a red haze, the contour lines, the glowing road */
  .bg { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: radial-gradient(60% 70% at 30% 45%, rgba(120, 8, 16, .38), transparent 70%), radial-gradient(40% 50% at 90% 80%, rgba(90, 6, 12, .25), transparent 70%), var(--os-ink); }
  .bg .topo { position: absolute; inset: -2%; background: url(topo.svg) center / cover no-repeat; opacity: .085; }
  .bg svg.road { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .bg::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 90% at 50% 40%, transparent 55%, rgba(0, 0, 0, .75)); }

  .stage { position: relative; z-index: 1; min-height: 100vh; width: min(1240px, 100%); margin: 0 auto; padding: 48px 32px 28px;
    display: grid; grid-template-columns: 1fr minmax(0, 500px); grid-template-rows: 1fr auto; column-gap: 56px; align-items: center; }
  .brand { display: flex; justify-content: center; align-items: center; }
  /* (wide screens: the logo stays in view on the left while a long page — the signed-in account — scrolls) */
  @media (min-width: 981px) {
    .stage { padding-top: 0; }
    main { padding-top: 48px; }
    .brand { position: sticky; top: 0; align-self: start; height: calc(100vh - 80px); }
  }
  .brand h1 { width: 100%; display: flex; justify-content: center; }
  .logo { width: min(600px, 100%); height: auto; filter: drop-shadow(0 18px 40px rgba(0, 0, 0, .6)); }
  main { display: flex; flex-direction: column; gap: 16px; padding: 24px 0; }
  .top { display: flex; justify-content: flex-end; font-size: 14px; }
  .top a { color: var(--os-text-2); font-weight: 600; letter-spacing: .04em; }
  .top a::before { content: '\2190\00a0'; }
  .top a:hover { color: #fff; text-decoration: none; }
  footer { grid-column: 1 / -1; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px 30px; padding-top: 28px; font-size: 14px; letter-spacing: .06em; color: var(--os-text-3); }
  footer a { color: var(--os-text-2); } footer a:hover { color: #fff; text-decoration: none; }

  /* the cards: a cut corner top right and bottom left, a red stripe along the top */
  section { position: relative; background: var(--os-card); border: 1px solid var(--os-line); padding: 44px 50px 40px; display: flex; flex-direction: column; gap: 16px;
    clip-path: polygon(0 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% 100%, var(--cut) 100%, 0 calc(100% - var(--cut)));
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55); backdrop-filter: blur(6px); }
  section::before { content: ''; position: absolute; left: 0; top: 0; width: 34%; height: 4px; background: linear-gradient(90deg, var(--os-red), var(--os-red-hi) 80%, rgba(255, 74, 54, .4)); }
  section::after { content: ''; position: absolute; right: 0; top: 0; width: calc(var(--cut) * 1.42); height: 1px; background: var(--os-line); transform-origin: right top; transform: rotate(45deg); }
  h1 { margin: 0; }
  h2 { margin: 0 0 2px; font: italic 800 38px/1.05 var(--f-display); font-stretch: 125%; letter-spacing: -.01em; color: #fff; text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
  section > p { margin: 0; }
  section > p.muted, .lede { color: var(--os-text-2); font-size: 17px; line-height: 1.5; margin-top: -6px; }
  label { display: flex; flex-direction: column; gap: 9px; font-size: 13px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--os-text-2); }
  label .lbl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  label .lbl a { text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 600; color: #fff; }
  label .lbl a:hover { color: var(--os-red-hi); text-decoration: none; }
  label.check { flex-direction: row; align-items: flex-start; gap: 10px; text-transform: none; letter-spacing: 0; font-size: 14px; font-weight: 500; color: var(--os-text-2); }
  label.check input { margin-top: 3px; accent-color: var(--os-red); width: 16px; height: 16px; }
  input, select, textarea { font: 500 17px var(--f-ui) !important; color: var(--c-text) !important; background: var(--os-well) !important; border: 1px solid var(--os-line-hi) !important; border-radius: 0 !important;
    padding: 15px 18px !important; text-transform: none; letter-spacing: 0; width: 100%; transition: border-color .15s, box-shadow .15s; color-scheme: dark; }
  input::placeholder, textarea::placeholder { color: #5C6168; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--os-red) !important; box-shadow: 0 0 0 3px rgba(227, 18, 30, .22), 0 0 18px rgba(227, 18, 30, .2); }
  .pw { position: relative; display: block; }
  .pw input { padding-right: 76px !important; }
  .pw button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; padding: 8px 14px; font: 600 15px var(--f-ui); color: #fff; letter-spacing: 0; text-transform: none; }
  .pw button:hover { color: var(--os-red-hi); }
  button { cursor: pointer; border: 0; color: inherit; }
  form { display: flex; flex-direction: column; gap: 18px; }

  /* the buttons */
  .btn { height: 56px; width: 100%; border-radius: 0 !important; font: italic 800 20px var(--f-display) !important; font-stretch: 125% !important; letter-spacing: .1em; text-transform: uppercase;
    transition: filter .15s, background .15s, border-color .15s, transform .08s; text-decoration: none !important; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { filter: grayscale(.6) brightness(.7); cursor: progress; }
  .btn.primary { margin-top: 8px; color: #fff; background: linear-gradient(180deg, #FF4A36 0%, #E3121E 48%, #B30A16 52%, #D8141F 100%);
    clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%); text-shadow: 0 1px 0 rgba(0, 0, 0, .35); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .25); }
  .btn.primary:hover { background: linear-gradient(180deg, #FF6A52 0%, #F01C28 48%, #C00D19 52%, #E81A25 100%); filter: drop-shadow(0 0 14px rgba(255, 40, 40, .45)); }
  .btn.secondary { background: #141417; border: 1px solid var(--os-line-hi); color: #fff; font: 600 17px var(--f-ui) !important; letter-spacing: .02em; text-transform: none; height: 54px; }
  .btn.secondary:hover { background: #1C1C20; border-color: #55555C; }
  .btn.ghost, .btn.guest { background: transparent; border: 1px solid #4A4A52; color: #fff; height: 60px; }
  .btn.ghost:hover, .btn.guest:hover { border-color: #fff; background: rgba(255, 255, 255, .04); }
  .btn.guest .arrow { display: inline-block; margin-left: 12px; font-style: normal; transition: transform .15s; }
  .btn.guest:hover .arrow { transform: translateX(4px); }
  .social { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  .social .btn { height: 58px; }
  .or { display: flex; align-items: center; gap: 16px; color: var(--os-text-3); font-size: 13px; letter-spacing: .3em; text-transform: uppercase; }
  .or::before, .or::after { content: ''; flex: 1; height: 1px; background: var(--os-line); }
  .caption { margin: -6px 0 0; text-align: center; color: var(--os-text-3); font-size: 15px; }
  .newhere { margin: 4px 0 0; padding-top: 22px; border-top: 1px solid var(--os-line); text-align: center; color: var(--os-text-2); font-size: 17px; }
  .newhere a { font-weight: 700; }

  .msg { padding: 12px 16px; font-size: 15px; border-left: 3px solid; background: rgba(13, 13, 15, .92); }
  .msg.bad { border-color: var(--c-bad); color: var(--c-bad-soft); background: linear-gradient(90deg, rgba(255, 90, 95, .14), rgba(13, 13, 15, .92)); }
  .msg.good { border-color: var(--c-good); color: var(--c-good); background: linear-gradient(90deg, rgba(61, 214, 140, .12), rgba(13, 13, 15, .92)); }
  .muted { color: var(--os-text-3); font-size: 14px; }
  .hint { font-size: 13px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .hint.bad { color: var(--c-bad-soft); } .hint.good { color: var(--c-good); }
  a { color: var(--os-red-hi); text-decoration: none; } a:hover { text-decoration: underline; }
  .links { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; font-size: 15px; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row .btn { flex: 1; width: auto; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 8px 18px; margin: 0; }
  dt { color: var(--os-text-3); font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; } dd { margin: 0; font-size: 15px; overflow-wrap: anywhere; }
  code, pre { color: #fff; }
  [hidden] { display: none !important; }
  #view { display: flex; flex-direction: column; gap: 22px; }
  #msg:empty { display: none; }

  /* narrower: the logo above the card */
  @media (max-width: 980px) {
    .stage { grid-template-columns: 1fr; grid-template-rows: auto auto auto; padding: 20px 16px 24px; justify-items: center; }
    .brand { width: 100%; }
    .logo { width: min(380px, 80%); }
    main { width: min(520px, 100%); padding-top: 0; }
    .top { order: -1; }
  }
  @media (max-width: 520px) {
    section { padding: 32px 22px 28px; --cut: 18px; }
    h2 { font-size: 30px; }
    .btn.primary { font-size: 18px !important; }
  }
  /* the moving parts: speed lines and embers in the backdrop (still unless motion is welcome) */
  .bg .lines span { position: absolute; left: 0; height: 1px; width: 22vw; opacity: 0; background: linear-gradient(90deg, transparent, rgba(255, 90, 70, .55), transparent); }
  .bg .embers span { position: absolute; bottom: -10px; width: 3px; height: 3px; border-radius: 50%; opacity: 0; background: #ff5a3c; box-shadow: 0 0 8px 2px rgba(255, 50, 30, .6); }
  .brand h1 { position: relative; }
  .brand h1::before { content: ''; position: absolute; inset: 10% 15%; z-index: -1; background: radial-gradient(closest-side, rgba(227, 18, 30, .35), transparent); filter: blur(20px); opacity: .6; }
  .road .streak { opacity: 0; }
  .btn.primary { position: relative; overflow: hidden; }
  .btn.primary::after { content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; transform: skewX(-20deg); background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .38), transparent); pointer-events: none; opacity: 0; }

  @media (prefers-reduced-motion: no-preference) {
    /* the road draws itself in, then headlights race along it */
    .road .glow { animation: pulse 4s ease-in-out 1.6s infinite; }
    @keyframes pulse { 50% { opacity: .55; } }
    .road .draw { stroke-dasharray: 1000; animation: draw 1.8s cubic-bezier(.6, 0, .2, 1) both; }
    @keyframes draw { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
    .road .streak { stroke-dasharray: 26 974; animation: race 3.2s linear 1.4s infinite; }
    .road .streak.b { animation-duration: 4.6s; animation-delay: 2.9s; }
    .road .streak.c { animation-duration: 5.4s; animation-delay: 4.1s; }
    @keyframes race { 0% { stroke-dashoffset: 26; opacity: 0; } 6% { opacity: 1; } 90% { opacity: 1; } 100% { stroke-dashoffset: -974; opacity: 0; } }
    .bg .topo { animation: drift 40s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.06) translate(-1.5%, 1%); } }
    .bg .lines span { animation: zoom var(--t, 2.6s) linear var(--d, 0s) infinite; }
    @keyframes zoom { 0% { transform: translateX(110vw); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateX(-30vw); opacity: 0; } }
    .bg .embers span { animation: rise var(--t, 12s) linear var(--d, 0s) infinite; }
    @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: .9; } 80% { opacity: .5; } 100% { transform: translate(var(--x, 40px), -105vh); opacity: 0; } }

    /* the logo arrives, then floats with a breathing red glow */
    .brand h1 { animation: arrive .9s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes arrive { from { opacity: 0; transform: translateX(-40px) skewX(-6deg); } }
    .logo { animation: float 6s ease-in-out 1s infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .brand h1::before { animation: breathe 4s ease-in-out infinite; }
    @keyframes breathe { 50% { opacity: 1; transform: scale(1.08); } }

    /* each card slides in (on every switch: sign in, make an account…), its parts one after another */
    section { animation: card .55s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes card { from { opacity: 0; transform: translateY(22px); } }
    section > *, section > form > * { animation: part .45s cubic-bezier(.2, .8, .2, 1) both; }
    @keyframes part { from { opacity: 0; transform: translateX(14px); } }
    section > :nth-child(2), section > form > :nth-child(2) { animation-delay: .06s; }
    section > :nth-child(3), section > form > :nth-child(3) { animation-delay: .12s; }
    section > :nth-child(4), section > form > :nth-child(4) { animation-delay: .18s; }
    section > :nth-child(5), section > form > :nth-child(5) { animation-delay: .24s; }
    section > :nth-child(6), section > form > :nth-child(6) { animation-delay: .3s; }
    section > :nth-child(n+7), section > form > :nth-child(n+7) { animation-delay: .36s; }
    /* the red stripe runs out along the top, and a gleam runs along it now and then */
    section::before { background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .85), transparent) no-repeat -40% 0 / 30% 100%, linear-gradient(90deg, var(--os-red), var(--os-red-hi) 80%, rgba(255, 74, 54, .4));
      animation: stripe .7s cubic-bezier(.2, .8, .2, 1) .25s both, gleam 5s ease-in-out 1.2s infinite; }
    @keyframes stripe { from { width: 0; } }
    @keyframes gleam { 0%, 70% { background-position: -40% 0, 0 0; } 100% { background-position: 140% 0, 0 0; } }
    /* the main button: a shine across it now and then, and on hover */
    .btn.primary::after { opacity: 1; animation: shine 4.5s ease-in-out 1.5s infinite; }
    .btn.primary:hover::after { animation-duration: 1.1s; animation-delay: 0s; }
    @keyframes shine { 0%, 75% { left: -40%; } 100% { left: 130%; } }
    .msg { animation: card .35s ease-out both; }
  }
</style>
</head>
