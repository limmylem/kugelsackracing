<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/site/config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kugelsack Racing · Connection check</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2em auto; max-width: 40em; padding: 0 1em; background: #0e1114; color: #e9ecef; }
  button { font: inherit; padding: .5em 1.2em; border-radius: 6px; border: 0; background: #36b3f5; color: #04121b; cursor: pointer; }
  pre { background: #1b2127; padding: 1em; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- The real-time server's connection check (docs/DEPLOYMENT.md "Real time"): 20 requests from this browser to
     rt.<domain>/health and the round trips' times — through Cloudflare and the tunnel. -->
<h1>Connection check</h1>
<p>Sends 20 requests to the game's real-time server and shows how long each round trip takes from here.</p>
<button id="go">Check</button>
<pre id="out"></pre>
<script type="module">
const out = document.getElementById('out'), say = t => { out.textContent += `${t}\n`; };
document.getElementById('go').onclick = async () => {
  out.textContent = '';
  const rt = globalThis.KR_SITE?.rt;
  if (!rt) { say('No real-time server is set for this page.'); return; }
  const url = `${rt.replace(/^ws(s?):/, 'http$1:').replace(/\/$/, '')}/health`, times = [];
  say(`Asking ${url} …`);
  // (the first one opens the connection, and says what the server is if it lets this page read it; then 20 timed)
  let mode = 'cors';
  try { const h = await (await fetch(url, { cache: 'no-store' })).json(); say(h.ok ? `The server is up (version ${String(h.version ?? '?').slice(0, 7)}${h.draining ? ', restarting' : ''}).` : 'The server answered, but not ok.'); }
  catch { mode = 'no-cors'; }
  for (let n = 0; n < 20; n++) {
    const t0 = performance.now();
    try { await fetch(`${url}?n=${n}`, { cache: 'no-store', mode }); }
    catch { say(times.length ? `Stopped after ${times.length}: the server didn't answer.` : 'The server didn\'t answer: it may be restarting (an update takes under a minute). Try again.'); if (!times.length) return; break; }
    times.push(performance.now() - t0);
    await new Promise(r => setTimeout(r, 100));
  }
  const s = [...times].sort((a, b) => a - b), k = s.length;
  say(`${k} round trips: median ${s[k >> 1].toFixed(0)} ms, best ${s[0].toFixed(0)} ms, worst ${s[k - 1].toFixed(0)} ms.`);
};
</script>
</body>
</html>
