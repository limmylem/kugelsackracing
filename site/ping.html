<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="/site/config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kugelsack Racing · Connection check</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 2em auto; max-width: 40em; padding: 0 1em; background: #0e1114; color: #e9ecef; }
  button { font: inherit; padding: .5em 1.2em; border-radius: 6px; border: 0; background: #36b3f5; color: #04121b; cursor: pointer; }
  pre { background: #1b2127; padding: 1em; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<!-- The real-time server's connection check (docs/DEPLOYMENT.md "Real time"): 20 WebSocket pings from this browser
     to rt.<domain> and the round trips' times — through Cloudflare or straight to the host, whichever rt is set to. -->
<h1>Connection check</h1>
<p>Sends 20 pings to the game's real-time server and shows how long each round trip takes from here.</p>
<button id="go">Check</button>
<pre id="out"></pre>
<script type="module">
const out = document.getElementById('out'), say = t => { out.textContent += `${t}\n`; };
document.getElementById('go').onclick = () => {
  out.textContent = '';
  const rt = globalThis.KR_SITE?.rt;
  if (!rt) { say('No real-time server is set for this page.'); return; }
  say(`Connecting to ${rt}/rt/health …`);
  const ws = new WebSocket(`${rt}/rt/health`), times = [];
  let n = 0, t0 = 0, opened = performance.now();
  const ping = () => { t0 = performance.now(); ws.send(JSON.stringify({ type: 'ping', t: n })); };
  ws.onopen = () => { say(`Connected in ${Math.round(performance.now() - opened)} ms.`); ping(); };
  ws.onmessage = e => {
    const m = JSON.parse(e.data);
    if (m.type !== 'pong' || m.t !== n) return;
    times.push(performance.now() - t0);
    if (++n < 20) setTimeout(ping, 100);
    else {
      ws.close();
      const s = [...times].sort((a, b) => a - b);
      say(`20 round trips: median ${s[10].toFixed(0)} ms, best ${s[0].toFixed(0)} ms, worst ${s[19].toFixed(0)} ms.`);
    }
  };
  ws.onclose = e => { if (n < 20) say(`Closed early (${e.code}${e.reason ? `: ${e.reason}` : ''}). A server asleep takes about a minute to wake: try again.`); };
  ws.onerror = () => say('The connection failed.');
};
</script>
</body>
</html>
