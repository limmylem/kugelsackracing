# The map files' local stand-in (docker-compose.yml): assets/ served as the tiles address serves it online
# (docs/DEPLOYMENT.md — Cloudflare R2): byte ranges for PMTiles (nginx answers Range by itself), CORS for the game's
# own address only, cached briefly.
server {
  listen 80;
  root /srv;
  types { application/json json; application/octet-stream pmtiles glb gz bin; image/png png; image/svg+xml svg; audio/ogg ogg; audio/mpeg mp3; }
  default_type application/octet-stream;

  location /assets/ {
    set $cors "";
    if ($http_origin ~ "^http://(localhost|127\.0\.0\.1):8787$") { set $cors $http_origin; }
    # (an empty value: no header — another site gets no CORS)
    add_header Access-Control-Allow-Origin $cors always;
    add_header Access-Control-Expose-Headers "Content-Range, Content-Length, Content-Type, ETag, Accept-Ranges" always;
    add_header Vary Origin always;
    add_header Cache-Control "public, max-age=300" always;
    if ($request_method = OPTIONS) { return 204; }
  }
  location / { return 404; }
}
